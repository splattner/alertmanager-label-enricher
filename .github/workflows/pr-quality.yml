name: PR Quality

on:
    pull_request:
        branches: [main]
    # Also verify main directly. Release Please updates its release PR using
    # GITHUB_TOKEN, and GitHub does not create workflow runs for events raised
    # by that token, so the release PR never picks up a fresh pull_request run.
    # Without this, a release could be cut against a stale check.
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    go-build-test:
        name: Go build, vet and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Verify gofmt
              run: |
                  unformatted="$(gofmt -l .)"
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Verify go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race -count=1 ./...

    golangci-lint:
        name: golangci-lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest

    docker-build:
        name: Docker build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image (no push)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    renovate-config:
        name: Validate Renovate config
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # A malformed config does not fail visibly — Renovate logs it and
            # carries on doing nothing, which looks identical to "no updates".
            - name: Validate
              run: npx --yes -p renovate renovate-config-validator renovate.json

    helm-lint-template:
        name: Helm lint and template
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Helm
              uses: azure/setup-helm@v5

            - name: Lint chart
              run: helm lint ./charts/alertmanager-label-enricher

            - name: Render chart (defaults)
              run: helm template ale ./charts/alertmanager-label-enricher > /tmp/render-default.yaml

            - name: Render chart (kubernetes source + RBAC + ServiceMonitor)
              run: |
                  helm template ale ./charts/alertmanager-label-enricher \
                    --set rbac.create=true \
                    --set-json 'rbac.rules=[{"apiGroups":[""],"resources":["namespaces"],"verbs":["get","list","watch"]}]' \
                    --set serviceMonitor.enabled=true \
                    > /tmp/render-full.yaml
                  grep -q 'kind: ClusterRole' /tmp/render-full.yaml
                  grep -q 'kind: ServiceMonitor' /tmp/render-full.yaml

            - name: Render chart (TLS server + forward)
              run: |
                  helm template ale ./charts/alertmanager-label-enricher \
                    --set tls.server.enabled=true --set tls.server.existingSecret=enricher-tls \
                    --set tls.forward.enabled=true --set tls.forward.existingSecret=am-ca \
                    > /tmp/render-tls.yaml
                  grep -q 'scheme: HTTPS' /tmp/render-tls.yaml
                  grep -q 'secretName: enricher-tls' /tmp/render-tls.yaml
                  grep -q 'secretName: am-ca' /tmp/render-tls.yaml

            - name: Render chart (TLS enabled without existingSecret fails)
              run: |
                  if helm template ale ./charts/alertmanager-label-enricher --set tls.server.enabled=true; then
                    echo "expected this render to fail without tls.server.existingSecret set" >&2
                    exit 1
                  fi

            - name: Render chart (PodDisruptionBudget + NetworkPolicy)
              run: |
                  helm template ale ./charts/alertmanager-label-enricher \
                    --set podDisruptionBudget.enabled=true \
                    --set networkPolicy.enabled=true \
                    --set-json 'networkPolicy.ingress.from=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
                    > /tmp/render-guardrails.yaml
                  grep -q 'kind: PodDisruptionBudget' /tmp/render-guardrails.yaml
                  grep -q 'kind: NetworkPolicy' /tmp/render-guardrails.yaml
                  grep -q 'kubernetes.io/metadata.name: monitoring' /tmp/render-guardrails.yaml

            - name: Render chart (PrometheusRule)
              run: |
                  helm template ale ./charts/alertmanager-label-enricher \
                    --set prometheusRule.enabled=true \
                    --set-json 'prometheusRule.labels={"release":"kube-prometheus-stack"}' \
                    > /tmp/render-prometheusrule.yaml
                  grep -q 'kind: PrometheusRule' /tmp/render-prometheusrule.yaml
                  grep -q 'alert: AlertmanagerLabelEnricherDown' /tmp/render-prometheusrule.yaml
                  grep -q 'release: kube-prometheus-stack' /tmp/render-prometheusrule.yaml
                  # The alert-templating trick ({{ "{{ $labels.x }}" }}) must
                  # render literally, not get evaluated as a Helm variable.
                  grep -q '{{ $labels.instance }}' /tmp/render-prometheusrule.yaml
