version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - unconvert

  exclusions:
    rules:
      # Test helpers close response bodies via defer/t.Cleanup in ways
      # bodyclose cannot trace through, so every call through a helper is a
      # false report.
      - path: _test\.go
        linters:
          - bodyclose
