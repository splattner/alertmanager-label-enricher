apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertmanager-label-enricher.fullname" . }}
  labels:
    {{- include "alertmanager-label-enricher.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "alertmanager-label-enricher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "alertmanager-label-enricher.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "alertmanager-label-enricher.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alertmanager-label-enricher
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.tls.server.enabled }}
              scheme: HTTPS
              {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.tls.server.enabled }}
              scheme: HTTPS
              {{- end }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/enricher
              readOnly: true
            {{- if .Values.tls.server.enabled }}
            - name: server-tls
              mountPath: /etc/enricher/tls
              readOnly: true
            {{- end }}
            {{- if .Values.tls.forward.enabled }}
            - name: forward-tls
              mountPath: /etc/enricher/forward-tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "alertmanager-label-enricher.fullname" . }}
        {{- if .Values.tls.server.enabled }}
        - name: server-tls
          secret:
            secretName: {{ required "tls.server.existingSecret is required when tls.server.enabled is true" .Values.tls.server.existingSecret }}
        {{- end }}
        {{- if .Values.tls.forward.enabled }}
        - name: forward-tls
          secret:
            secretName: {{ required "tls.forward.existingSecret is required when tls.forward.enabled is true" .Values.tls.forward.existingSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
