{{- if .Values.crd.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: enrichmentrules.enricher.splattner.github.io
  labels:
    {{- include "alertmanager-label-enricher.labels" . | nindent 4 }}
  annotations:
    # helm uninstall must never delete this CRD: doing so deletes every
    # EnrichmentRule in the cluster, across every tenant namespace.
    helm.sh/resource-policy: keep
spec:
  group: enricher.splattner.github.io
  scope: Namespaced
  names:
    kind: EnrichmentRule
    listKind: EnrichmentRuleList
    plural: enrichmentrules
    singular: enrichmentrule
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Required
          type: boolean
          jsonPath: .spec.required
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              description: >-
                Same shape as one entry in config.yaml's top-level `rules`
                list, minus `name` (taken from metadata.name instead). See
                docs/configuration.md for the full field reference. A
                cluster admin's enforcement policy (config.yaml's
                `enforcement`) may reject this rule at reconcile time even
                if it passes this schema - matching namespaceSelector,
                allowed labels/annotations/sources, and required: true all
                still apply.
              required: [actions]
              properties:
                order:
                  type: integer
                  description: >-
                    Deterministic tie-breaker among a namespace's own
                    rules (and, loosely, relative to other namespaces'
                    rules) when more than one is compiled. Lower runs
                    first. Rules with equal order are ordered by
                    namespace then name.
                required:
                  type: boolean
                  description: >-
                    Fail the whole batch closed (503) if this rule's
                    action can't be satisfied. Rejected by enforcement
                    unless the matching policy entry sets
                    allowRequired: true.
                dryRun:
                  type: boolean
                match:
                  type: array
                  items:
                    type: object
                    required: [label, op]
                    properties:
                      label:
                        type: string
                      op:
                        type: string
                        enum: [exists, absent, eq, ne, regex, notregex]
                      value:
                        type: string
                actions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      set:
                        type: object
                        properties:
                          label:
                            type: string
                          annotation:
                            type: string
                          value:
                            type: string
                          template:
                            type: string
                          default:
                            type: string
                          overwrite:
                            type: boolean
                          force:
                            type: boolean
                            description: Rejected by enforcement for annotations; only meaningful for a reserved label.
                          from:
                            type: object
                            required: [source, jq]
                            properties:
                              source:
                                type: string
                                description: >-
                                  Must be one of the file config's
                                  declared sources, and named in the
                                  matching enforcement policy's
                                  allowedSources - empty by default, so
                                  no source is usable until a cluster
                                  admin grants one.
                              jq:
                                type: string
                              regex:
                                type: string
                      drop:
                        type: object
                        properties:
                          label:
                            type: string
                          annotation:
                            type: string
                          force:
                            type: boolean
            status:
              type: object
              description: >-
                Set by the enricher, never by the tenant. `conditions`
                mirrors the Kubernetes convention (type/status/reason/
                message/lastTransitionTime): a single `Ready` condition
                reports whether this rule is currently compiled into the
                engine, and why not if it isn't. No leader election
                guards these writes across enricher replicas, so this is
                eventually consistent, not exclusive - see
                docs/configuration.md.
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
{{- end }}
