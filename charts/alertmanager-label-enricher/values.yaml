# -- Number of enricher replicas. The service fans an alert batch out to
# every Alertmanager target and only needs one instance to succeed
# (forward.minSuccess in config), so replicas here are for enricher
# availability, not Alertmanager HA.
replicaCount: 1

image:
  repository: ghcr.io/splattner/alertmanager-label-enricher
  # -- Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 9099

# -- The enricher's config.yaml, mounted from a ConfigMap. See the project
# README for the full schema (targets, sources, rules).
config: |
  server:
    listen: ":9099"
  targets:
    - url: http://alertmanager:9093

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  # -- Creates a ClusterRole/ClusterRoleBinding granting get/list/watch on
  # the resources named in `rules`. Required only when config.yaml declares
  # a source of type `kubernetes`; the chart cannot infer the GVRs from
  # `config` (a raw string), so they must be listed here too.
  create: false
  rules: []
  # rules:
  #   - apiGroups: [""]
  #     resources: ["namespaces"]
  #     verbs: ["get", "list", "watch"]

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}
# resources:
#   requests:
#     cpu: 50m
#     memory: 64Mi
#   limits:
#     memory: 128Mi

tls:
  server:
    # -- Mounts existingSecret (a kubernetes.io/tls Secret: tls.crt, tls.key,
    # optionally ca.crt for mTLS) at /etc/enricher/tls, and switches the
    # liveness/readiness probes to HTTPS. Reference the mounted paths from
    # `config`'s `server.tls` (e.g. certFile: /etc/enricher/tls/tls.crt).
    enabled: false
    existingSecret: ""
  forward:
    # -- Mounts existingSecret (a Secret containing ca.crt and, for a
    # client certificate, tls.crt/tls.key) at /etc/enricher/forward-tls.
    # Reference the mounted paths from `config`'s `forward.tls`.
    enabled: false
    existingSecret: ""

# -- Extra volumes, e.g. a Secret with an HTTP source's bearer token, or a
# file-source mapping file separate from the main config.
extraVolumes: []
extraVolumeMounts: []

extraEnv: []
# extraEnv:
#   - name: CMDB_TOKEN
#     valueFrom:
#       secretKeyRef:
#         name: cmdb-token
#         key: token

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

podDisruptionBudget:
  # -- Creates a PodDisruptionBudget. Leave disabled at the default
  # replicaCount of 1: a PDB requiring an available pod on a single-replica
  # Deployment blocks voluntary node drains/evictions entirely.
  enabled: false
  # -- Takes precedence over maxUnavailable if set.
  minAvailable: ""
  maxUnavailable: 1

networkPolicy:
  # -- Creates a NetworkPolicy restricting inbound traffic on the
  # enricher's port (alert ingestion and /metrics share one listener) to
  # `ingress.from`. Egress is left unrestricted unless `egress` is set
  # explicitly, since safely allow-listing the Kubernetes API server, any
  # HTTP sources, and DNS is deployment-specific.
  enabled: false
  ingress:
    # -- NetworkPolicyPeer list. Left empty, ingress.enabled=true still
    # denies all ingress until this is set — required reading before
    # enabling.
    from: []
    # from:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: monitoring
  egress: []
  # egress:
  #   - {}   # allow all egress, equivalent to having no NetworkPolicy

nodeSelector: {}
tolerations: []
affinity: {}
