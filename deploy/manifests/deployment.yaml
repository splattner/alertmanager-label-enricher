apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-label-enricher
  labels:
    app.kubernetes.io/name: alertmanager-label-enricher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-label-enricher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-label-enricher
    spec:
      serviceAccountName: alertmanager-label-enricher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-label-enricher
          image: ghcr.io/splattner/alertmanager-label-enricher:latest
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9099
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          volumeMounts:
            - name: config
              mountPath: /etc/enricher
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-label-enricher
