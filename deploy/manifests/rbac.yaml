# Only required when config.yaml declares a source of type `kubernetes`.
# List get/list/watch on exactly the resources your sources reference.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alertmanager-label-enricher
  labels:
    app.kubernetes.io/name: alertmanager-label-enricher
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alertmanager-label-enricher
  labels:
    app.kubernetes.io/name: alertmanager-label-enricher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alertmanager-label-enricher
subjects:
  - kind: ServiceAccount
    name: alertmanager-label-enricher
    namespace: default
